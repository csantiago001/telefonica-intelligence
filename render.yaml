# render.yaml — Despliegue PERMANENTE y GRATUITO en Internet.
#
# Arquitectura (sin tu PC, sin IP, permanente, sin costo):
#   - La app corre en Render (plan gratuito).
#   - La base de datos (SQLite) se respalda en tiempo real en tu Cloudflare R2 con
#     Litestream y se restaura al arrancar: los datos NO se pierden al reiniciar.
#   - Las evidencias e informes se guardan directamente en Cloudflare R2.
#
# PASOS (guía detallada en docs/DESPLIEGUE.md):
#   1. En Cloudflare: cree un bucket R2 (p. ej. "telefonica") y un token de API R2
#      con permisos de lectura/escritura. Anote: Account ID, Access Key ID, Secret.
#   2. En Render: New → Blueprint → elija este repositorio.
#   3. Render pedirá los valores marcados como secretos (abajo): péguelos.
#      - MASTER_KEY: 64 caracteres hexadecimales (genérela y GUÁRDELA aparte).
#      - R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY: de Cloudflare.
#   4. Aplique. Obtendrá una URL https://...onrender.com; póngala en PUBLIC_URL.
#   5. Abra esa URL desde cualquier dispositivo y cree su administrador.
#
# Nota: en el plan gratuito el servicio "duerme" tras ~15 min sin uso; la primera
# visita después tarda ~30 s en despertar. Los datos siguen seguros en R2.
services:
  - type: web
    name: telefonica-intelligence
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.nube
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: MASTER_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
